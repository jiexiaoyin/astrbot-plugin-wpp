<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WPP 账号诊断</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6f9;
        --panel: #ffffff;
        --panel-2: #f8fafc;
        --text: #17202a;
        --muted: #667085;
        --line: #e4e8ee;
        --brand: #2f6bff;
        --brand-strong: #1d4ed8;
        --brand-soft: #eaf0ff;
        --ok: #0f9d58;
        --ok-soft: #e8f7ef;
        --warn: #b7791f;
        --warn-soft: #fff7e6;
        --err: #d92d20;
        --err-soft: #fef0ef;
        --shadow: 0 8px 24px rgba(16, 24, 40, 0.06);
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #0e1116;
        --panel: #161b23;
        --panel-2: #1b222c;
        --text: #e8edf5;
        --muted: #93a0b4;
        --line: #2a3443;
        --brand: #5b8cff;
        --brand-strong: #7aa2ff;
        --brand-soft: #1b2b4d;
        --ok: #3ddc97;
        --ok-soft: #123328;
        --warn: #f5c26b;
        --warn-soft: #3a2c14;
        --err: #ff7b72;
        --err-soft: #3d1b1a;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        min-height: 100vh; padding: 26px 22px 48px;
        background:
          radial-gradient(900px 420px at 100% -10%, var(--brand-soft), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Microsoft YaHei", sans-serif;
        font-size: 14px; line-height: 1.5;
      }
      .shell { max-width: 820px; margin: 0 auto; }
      .hero {
        display: flex; align-items: flex-end; justify-content: space-between;
        gap: 18px; flex-wrap: wrap; margin-bottom: 20px;
      }
      .brand { display: flex; align-items: center; gap: 14px; }
      .logo {
        width: 46px; height: 46px; border-radius: 15px; flex: none;
        display: grid; place-items: center;
        background: linear-gradient(135deg, #2f6bff, #7c3aed);
        box-shadow: 0 10px 22px rgba(47, 107, 255, 0.28);
        color: #fff; font-size: 20px; font-weight: 750;
      }
      h1 { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -0.01em; }
      .sub { margin-top: 3px; color: var(--muted); font-size: 12.5px; }
      .actions { display: flex; gap: 9px; flex-wrap: wrap; }
      button, .btn-link {
        appearance: none; border: 1px solid transparent; border-radius: 9px;
        padding: 8px 15px; font: inherit; font-size: 13px; font-weight: 600;
        cursor: pointer; text-decoration: none; white-space: nowrap;
        transition: background 0.15s ease, border-color 0.15s ease, opacity 0.15s ease;
      }
      button { background: var(--brand); color: #fff; }
      button:hover { background: var(--brand-strong); }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      button.ghost, .btn-link {
        background: var(--panel); color: var(--text); border-color: var(--line);
      }
      button.ghost:hover, .btn-link:hover { background: var(--panel-2); border-color: var(--muted); }
      .card {
        background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
        box-shadow: var(--shadow); padding: 20px; margin-bottom: 16px;
      }
      .card-head {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; flex-wrap: wrap; margin-bottom: 14px;
      }
      h2 { margin: 0; font-size: 15px; font-weight: 680; }
      .card-head .muted, .muted { color: var(--muted); font-size: 12px; }
      .account-list { display: grid; gap: 9px; }
      .account-row {
        display: flex; align-items: center; gap: 11px; padding: 11px 12px;
        border: 1px solid var(--line); border-radius: 11px; background: var(--panel-2);
      }
      .avatar {
        width: 36px; height: 36px; border-radius: 11px; flex: none;
        display: grid; place-items: center; color: #fff; font-size: 14px; font-weight: 700;
        background: linear-gradient(135deg, #2f6bff, #7c3aed);
      }
      .account-main { flex: 1; min-width: 0; }
      .account-main b { display: block; font-size: 13.5px; font-weight: 650; }
      .account-main small {
        display: block; margin-top: 1px; color: var(--muted); font-size: 11px;
        overflow-wrap: anywhere;
      }
      .status {
        display: inline-flex; align-items: center; gap: 6px; flex: none;
        border-radius: 999px; padding: 3px 9px; font-size: 11.5px; font-weight: 600;
        background: var(--panel); color: var(--muted); border: 1px solid var(--line);
      }
      .status.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
      .status.bad { background: var(--err-soft); color: var(--err); border-color: transparent; }
      .status.wait { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
      .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
      .query-row { display: flex; gap: 9px; }
      input[type="password"] {
        flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 9px;
        background: var(--panel); color: var(--text); font: inherit; font-size: 13px;
        padding: 9px 11px; outline: none;
      }
      input[type="password"]:focus {
        border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft);
      }
      .hint { margin-top: 7px; color: var(--muted); font-size: 11.5px; line-height: 1.5; }
      .link { color: var(--brand); overflow-wrap: anywhere; }
      #result { margin-top: 16px; }
      .profile {
        display: flex; align-items: center; gap: 13px; padding: 14px;
        border: 1px solid var(--line); border-radius: 12px; background: var(--panel-2);
        margin-bottom: 13px;
      }
      .profile .avatar { width: 48px; height: 48px; border-radius: 14px; font-size: 19px; }
      .profile .who b { display: block; font-size: 16px; font-weight: 680; }
      .profile .who small { color: var(--muted); font-size: 11.5px; overflow-wrap: anywhere; }
      .fields {
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1px; background: var(--line); border: 1px solid var(--line);
        border-radius: 11px; overflow: hidden;
      }
      .field { background: var(--panel); padding: 9px 11px; min-width: 0; }
      .field .k { color: var(--muted); font-size: 10.5px; }
      .field .v { margin-top: 1px; font-size: 12.5px; overflow-wrap: anywhere; }
      .banner {
        display: flex; align-items: flex-start; gap: 9px; padding: 11px 13px;
        border-radius: 10px; font-size: 12.5px;
      }
      .banner.ok { background: var(--ok-soft); color: var(--ok); }
      .banner.bad { background: var(--err-soft); color: var(--err); }
      .banner.wait { background: var(--warn-soft); color: var(--warn); }
      .banner b { display: block; }
      .banner small { display: block; margin-top: 1px; color: inherit; opacity: 0.9; }
      .empty { color: var(--muted); font-size: 12.5px; padding: 8px 0; }
      .toast {
        position: fixed; left: 50%; bottom: 22px; z-index: 20;
        transform: translate(-50%, 16px); opacity: 0; pointer-events: none;
        max-width: min(520px, calc(100vw - 32px)); padding: 10px 16px; border-radius: 10px;
        background: var(--text); color: var(--panel); font-size: 12.5px; font-weight: 550;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.22);
        transition: opacity 0.18s ease, transform 0.18s ease;
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
      .toast.err { background: var(--err); color: #fff; }
      @media (max-width: 620px) {
        body { padding: 18px 12px 40px; }
        .actions { width: 100%; }
        .actions button, .actions .btn-link { flex: 1; text-align: center; }
        .fields { grid-template-columns: 1fr; }
        .query-row { flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="hero">
        <div class="brand">
          <div class="logo">W</div>
          <div>
            <h1>WPP 账号诊断</h1>
            <div class="sub">在线状态 · 身份信息 · Token 排查</div>
          </div>
        </div>
        <div class="actions">
          <a class="btn-link" id="gotoPolicy" href="#">返回控制台</a>
          <button class="ghost" id="refreshBtn" type="button">刷新状态</button>
        </div>
      </header>

      <section class="card">
        <div class="card-head">
          <h2>已配置账号</h2>
          <span class="muted" id="accountHint">加载中…</span>
        </div>
        <div class="account-list" id="accounts">
          <div class="empty">加载中…</div>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Token 诊断</h2>
          <span class="muted">仅用于本次查询，不会保存</span>
        </div>
        <div class="query-row">
          <input type="password" id="token" autocomplete="off" placeholder="输入 X-Access-Token（authcode）" />
          <button id="btn" type="button">查询账号</button>
        </div>
        <div class="hint">
          填入绑定微信账号的 X-Access-Token，可检查该账号是否在线并读取昵称/wxid。
          若账号离线，请到 WPP 管理面板扫码登录（查询后显示地址）：
          <a class="link" id="panelLink" target="_blank" rel="noreferrer" hidden></a>
        </div>
        <div id="result"></div>
      </section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script type="module">
      const bridge = window.AstrBotPluginPage;
      const accountsEl = document.getElementById("accounts");
      const accountHint = document.getElementById("accountHint");
      const refreshBtn = document.getElementById("refreshBtn");
      const btn = document.getElementById("btn");
      const tokenInput = document.getElementById("token");
      const result = document.getElementById("result");
      const panelLink = document.getElementById("panelLink");
      const toastEl = document.getElementById("toast");
      let toastTimer = 0;

      await bridge.ready();

      // 兄弟页面链接由运行时替换路由最后一段, 避免被 Pages 资产重写器
      // 改写成本页资产。
      const pagePath = location.pathname.replace(/\/+$/, "").split("/");
      pagePath[pagePath.length - 1] = "console";
      const themeParam = new URLSearchParams(location.search).get("theme");
      document.getElementById("gotoPolicy").href =
        pagePath.join("/") + "/" + (themeParam ? `?theme=${encodeURIComponent(themeParam)}` : "");

      function esc(s) {
        return String(s ?? "").replace(/[&<>"']/g, (c) => ({
          "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
        })[c]);
      }

      function toast(text, isError = false) {
        clearTimeout(toastTimer);
        toastEl.textContent = text;
        toastEl.className = `toast show${isError ? " err" : ""}`;
        toastTimer = setTimeout(() => { toastEl.className = "toast"; }, 3200);
      }

      async function post(route, body = {}) {
        const resp = await bridge.apiPost(route, body);
        if (resp?.error) throw new Error(resp.message || resp.error);
        return resp || {};
      }

      function statusOf(account) {
        const st = account.stats?.status || {};
        if (st.online === true) return { cls: "ok", text: "在线", st };
        if (st.online === false) return { cls: "bad", text: "离线", st };
        return { cls: "wait", text: "查询中", st };
      }

      function renderAccounts(instances) {
        const rows = [];
        for (const inst of instances) {
          for (const account of inst.accounts || []) {
            const { cls, text, st } = statusOf(account);
            const name = st.nickname || account.id;
            const initial = String(name || "W").trim().charAt(0).toUpperCase() || "W";
            rows.push(`
              <div class="account-row" data-instance="${esc(inst.id)}" data-account="${esc(account.id)}">
                <div class="avatar">${esc(initial)}</div>
                <div class="account-main">
                  <b>${esc(name)}</b>
                  <small>实例 ${esc(inst.id)} · 账号 ${esc(account.id)} · wxid ${esc(st.wxid || "未获取")}</small>
                </div>
                <span class="status ${cls}" title="${esc(st.message || "")}"><span class="dot"></span>${text}</span>
              </div>`);
          }
        }
        accountsEl.innerHTML = rows.length
          ? rows.join("")
          : `<div class="empty">尚未配置 WPP 账号，请先在平台适配器中添加。</div>`;
        accountHint.textContent = rows.length ? `${rows.length} 个账号` : "无账号";
      }

      async function loadAccounts(refresh = false) {
        refreshBtn.disabled = true;
        refreshBtn.textContent = refresh ? "刷新中…" : "刷新状态";
        try {
          const resp = refresh
            ? await post("status-refresh")
            : await post("policy");
          renderAccounts(resp.instances || []);
          if (refresh) toast("账号状态已刷新");
        } catch (e) {
          accountsEl.innerHTML = `<div class="empty">加载失败：${esc(e?.message || e)}</div>`;
          accountHint.textContent = "加载失败";
          if (refresh) toast("刷新失败：" + (e?.message || e), true);
        } finally {
          refreshBtn.disabled = false;
          refreshBtn.textContent = "刷新状态";
        }
      }

      function profileField(label, value) {
        if (!value) return "";
        return `<div class="field"><div class="k">${esc(label)}</div><div class="v">${esc(value)}</div></div>`;
      }

      function renderProfile(data) {
        const p = data.profile || {};
        const flat = {
          nickname: data.nickname || p.nickname || "",
          wxid: data.wxid || p.wxid || "",
          province: data.province || p.province || "",
          city: data.city || p.city || "",
          country: data.country || p.country || "",
          signature: data.signature || p.signature || "",
          sex: data.sex ?? p.sex,
          email: data.email || p.email || "",
          mobile: data.mobile || p.mobile || "",
        };
        const location = [flat.province, flat.city, flat.country].filter(Boolean).join(" ");
        const sex = flat.sex === 1 ? "男" : flat.sex === 2 ? "女" : "";
        const initial = esc(String(flat.nickname || "W").trim().charAt(0).toUpperCase() || "W");
        result.innerHTML = `
          <div class="banner ok"><span>●</span><span><b>账号在线</b><small>${esc(data.message || "")}</small></span></div>
          <div class="profile" style="margin-top:12px;">
            <div class="avatar">${initial}</div>
            <div class="who">
              <b>${esc(flat.nickname || "未知昵称")}</b>
              <small>微信ID：${esc(flat.wxid || "未知")}</small>
            </div>
          </div>
          <div class="fields">
            ${profileField("地区", location)}
            ${profileField("性别", sex)}
            ${profileField("签名", flat.signature)}
            ${profileField("邮箱", flat.email)}
            ${profileField("手机", flat.mobile)}
          </div>`;
      }

      function renderOffline(data) {
        const message = data.message || "账号未登录或长连接未建立";
        result.innerHTML = `
          <div class="banner bad"><span>●</span><span><b>账号未在线</b><small>${esc(message)}</small></span></div>
          <div class="hint">${data.auto_heartbeat ? "已尝试自动心跳但仍未上线。" : ""}
          请到 WPP 管理面板检查登录状态，扫码登录后再查询。</div>`;
      }

      function updatePanelUrl(url) {
        if (!url) return;
        let parsed;
        try { parsed = new URL(url); } catch { return; }
        if (parsed.protocol !== "http:" && parsed.protocol !== "https:") return;
        panelLink.href = parsed.href;
        panelLink.textContent = parsed.href;
        panelLink.hidden = false;
      }

      btn.addEventListener("click", async () => {
        const token = tokenInput.value.trim();
        if (!token) {
          result.innerHTML = `<div class="banner bad" style="margin-top:14px;">请输入 X-Access-Token</div>`;
          return;
        }
        btn.disabled = true;
        btn.textContent = "查询中…";
        result.innerHTML = `<div class="hint" style="margin-top:14px;">正在连接 WPP 服务…</div>`;
        try {
          const resp = await post("account-info", { token });
          updatePanelUrl(resp.panel_url);
          if (resp.online) renderProfile(resp);
          else renderOffline(resp);
        } catch (e) {
          result.innerHTML = `<div class="banner bad" style="margin-top:14px;">
            <span>●</span><span><b>查询失败</b><small>${esc(e?.message || e)}</small></span></div>`;
        } finally {
          btn.disabled = false;
          btn.textContent = "查询账号";
        }
      });

      tokenInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") btn.click();
      });
      refreshBtn.addEventListener("click", () => loadAccounts(true));

      loadAccounts();
    </script>
  </body>
</html>
